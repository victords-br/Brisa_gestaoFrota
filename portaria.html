<!DOCTYPE html>
<html data-bs-theme="light" lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Brisa Transporte — Portaria</title>
    <link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css">
    <link rel="manifest" href="manifest.json" crossorigin="use-credentials">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css">
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="assets/css/operations.css">
    <link rel="stylesheet" href="assets/css/brand.css">
    <link rel="stylesheet" href="assets/css/dashboard.css">
    <link rel="stylesheet" href="assets/css/portaria.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="dashboard-page portaria-page">
    <nav class="navbar navbar-expand-lg sticky-top dashboard-nav">
        <div class="container-fluid"><a class="navbar-brand brand-lockup" href="portaria.html" aria-label="Brisa Transporte, portaria">
                <img class="brand-logo" src="assets/brisa-logo.svg" alt="">
                <span class="brand-name"><strong>Brisa Transporte</strong><small>PORTARIA</small></span>
            </a>
            <div class="d-flex align-items-center"><a class="btn btn-outline-primary btn-sm me-2" role="button" href="/portaria.html"><svg class="bi bi-plus-circle me-1" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"></path>
                        <path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4"></path>
                    </svg>Nova OS </a><button class="btn btn-danger btn-sm" id="btn-sair"><svg class="bi bi-box-arrow-right me-1" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" fill="currentColor" viewBox="0 0 16 16">
                        <path fill-rule="evenodd" d="M10 12.5a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5h8a.5.5 0 0 1 .5.5v2a.5.5 0 0 0 1 0v-2A1.5 1.5 0 0 0 9.5 2h-8A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h8a1.5 1.5 0 0 0 1.5-1.5v-2a.5.5 0 0 0-1 0z"></path>
                        <path fill-rule="evenodd" d="M15.854 8.354a.5.5 0 0 0 0-.708l-3-3a.5.5 0 0 0-.708.708L14.293 7.5H5.5a.5.5 0 0 0 0 1h8.793l-2.147 2.146a.5.5 0 0 0 .708.708z"></path>
                    </svg>Sair </button></div>
        </div>
    </nav>
    <main class="container-fluid dashboard-shell portaria-shell">
        <header class="dashboard-heading">
            <div>
                <p class="dashboard-kicker"><span></span> OPERAÇÃO DA GARAGEM</p>
                <h1>Portaria</h1>
            </div>
            <span class="dashboard-heading-mark"><i class="bi bi-shield-check"></i> Vistoria e abertura de OS</span>
        </header>
        <div class="row g-4">
            <div class="col-12">
                <div class="card mb-4 portaria-form-card">
                    <div class="header-app">
                        <h5><svg class="bi bi-tools me-2" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" fill="currentColor" viewBox="0 0 16 16">
                                <path d="M1 0 0 1l2.2 3.081a1 1 0 0 0 .815.419h.07a1 1 0 0 1 .708.293l2.675 2.675-2.617 2.654A3.003 3.003 0 0 0 0 13a3 3 0 1 0 5.878-.851l2.654-2.617.968.968-.305.914a1 1 0 0 0 .242 1.023l3.27 3.27a.997.997 0 0 0 1.414 0l1.586-1.586a.997.997 0 0 0 0-1.414l-3.27-3.27a1 1 0 0 0-1.023-.242L10.5 9.5l-.96-.96 2.68-2.643A3.005 3.005 0 0 0 16 3q0-.405-.102-.777l-2.14 2.141L12 4l-.364-1.757L13.777.102a3 3 0 0 0-3.675 3.68L7.462 6.46 4.793 3.793a1 1 0 0 1-.293-.707v-.071a1 1 0 0 0-.419-.814zm9.646 10.646a.5.5 0 0 1 .708 0l2.914 2.915a.5.5 0 0 1-.707.707l-2.915-2.914a.5.5 0 0 1 0-.708M3 11l.471.242.529.026.287.445.445.287.026.529L5 13l-.242.471-.026.529-.445.287-.287.445-.529.026L3 15l-.471-.242L2 14.732l-.287-.445L1.268 14l-.026-.529L1 13l.242-.471.026-.529.445-.287.287-.445.529-.026z"></path>
                            </svg>Criar Ordem de Serviço (OS) </h5><small id="nome-porteiro">Carregando...</small>
                    </div>
                    <div class="card-body p-4">
                        <form id="form-os">
                            <div class="mb-3 portaria-field"><label class="form-label fw-bold" for="veiculo-os">Veículo</label><select class="form-select" id="veiculo-os" required="">
                                    <option value="">Carregando veículos...</option>
                                </select></div>
                            <div class="mb-3 portaria-field"><label class="form-label fw-bold" for="funcionario-os">Motorista / Responsável</label><select class="form-select" id="funcionario-os" required>
                                    <option value="">Carregando funcionários...</option>
                                </select></div>
                            <div class="mb-3 portaria-field"><label class="form-label fw-bold" for="grupo-os">Grupo do Problema</label><select class="form-select" id="grupo-os" required="">
                                    <option value="">Carregando grupos...</option>
                                </select></div>
                            <div class="mb-3 portaria-field"><label class="form-label fw-bold" for="prioridade-os">Prioridade</label><select class="form-select" id="prioridade-os" required="">
                                    <option value="Normal">Normal</option>
                                    <option value="Urgente">Urgente</option>
                                    <option value="Imediata (Veículo Parado)">Imediata (Veículo Parado)</option>
                                </select></div>
                            <div class="mb-3 portaria-field portaria-field-wide"><label class="form-label fw-bold" for="descricao-os">Descrição do Problema / Defeito</label><textarea class="form-control" id="descricao-os" placeholder="Descreva detalhadamente o problema relatado..." required="" rows="4"></textarea></div><button class="btn btn-primary fw-bold w-100 py-2 portaria-submit" type="submit" id="btn-enviar-os"><svg class="bi bi-send me-1" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" fill="currentColor" viewBox="0 0 16 16">
                                    <path d="M15.854.146a.5.5 0 0 1 .11.54l-5.819 14.547a.75.75 0 0 1-1.329.124l-3.178-4.995L.643 7.184a.75.75 0 0 1 .124-1.33L15.314.037a.5.5 0 0 1 .54.11ZM6.636 10.07l2.761 4.338L14.13 2.576zm6.787-8.201L1.591 6.602l4.339 2.76z"></path>
                                </svg> Abrir Ordem de Serviço </button>
                            <div class="text-center mt-3 portaria-feedback" id="msg-os"></div>
                        </form>
                    </div>
                </div>
                <section class="ops-section mb-4">
                    <header class="ops-section-header py-3 d-flex justify-content-between align-items-center">
                        <h5 class="fw-bold mb-0"><i class="bi bi-clipboard2-check text-warning me-2"></i>Checklists para vistoria</h5>
                        <span class="badge bg-warning text-dark" id="total-checklists-portaria">0</span>
                    </header>
                    <div class="ops-section-body">
                        <div id="tabela-checklists-portaria" class="ops-card-list"><p class="ops-empty">Carregando checklists...</p></div>
                    </div>
                </section>
                <section class="ops-section mb-5">
                    <header class="ops-section-header py-3">
                        <h5 class="fw-bold mb-0"><svg class="bi bi-list-task text-primary me-2" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" fill="currentColor" viewBox="0 0 16 16">
                                <path fill-rule="evenodd" d="M2 2.5a.5.5 0 0 0-.5.5v1a.5.5 0 0 0 .5.5h1a.5.5 0 0 0 .5-.5V3a.5.5 0 0 0-.5-.5zM3 3H2v1h1z"></path>
                                <path d="M5 3.5a.5.5 0 0 1 .5-.5h9a.5.5 0 0 1 0 1h-9a.5.5 0 0 1-.5-.5M5.5 7a.5.5 0 0 0 0 1h9a.5.5 0 0 0 0-1zm0 4a.5.5 0 0 0 0 1h9a.5.5 0 0 0 0-1z"></path>
                                <path fill-rule="evenodd" d="M1.5 7a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5H2a.5.5 0 0 1-.5-.5zM2 7h1v1H2zm0 3.5a.5.5 0 0 0-.5.5v1a.5.5 0 0 0 .5.5h1a.5.5 0 0 0 .5-.5v-1a.5.5 0 0 0-.5-.5zm1 .5H2v1h1z"></path>
                            </svg>OSs Abertas pela Portaria </h5>
                    </header>
                    <div class="ops-section-body">
                        <div id="tabela-os-portaria" class="ops-card-list"><p class="ops-empty">Carregando OSs...</p></div>
                    </div>
                </section>
            </div>
        </div>
    </main>
    <script src="assets/bootstrap/js/bootstrap.min.js"></script>
    <script src="assets/js/supabase-config.js"></script>
    <script src="assets/js/portaria.js"></script>
</body>

</html>
