<!DOCTYPE html>
<html data-bs-theme="light" lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Brisa Transporte — Acesso</title>
    <link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css">
    <link rel="manifest" href="manifest.json" crossorigin="use-credentials">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css">
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="assets/css/brand.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
    <div class="container">
        <div class="card card-login">
            <div class="card-body p-4">
                <div class="brand-lockup brand-login">
                    <img class="brand-logo" src="assets/brisa-logo.svg" alt="">
                    <span class="brand-name"><strong>Brisa Transporte</strong><small>GESTÃO DE FROTA</small></span>
                </div>
                <h4 class="text-center mb-4">Acesso ao sistema</h4>
                <p class="text-center text-muted mb-4">Entre com seu email e senha</p>
                <form id="form-login">
                    <div class="mb-3"><label class="form-label">Email</label><input class="form-control" type="email" id="email" placeholder="seu@email.com" required=""></div>
                    <div class="mb-3"><label class="form-label">Senha</label><input class="form-control" type="password" id="senha" placeholder="••••••••" required=""></div><button class="btn btn-primary w-100 mt-2" type="submit" id="btn-entrar"> Entrar </button>
                    <div class="text-center mt-3 msg-erro" id="msg-erro"></div>
                </form>
            </div>
        </div>
    </div>
    <script src="assets/bootstrap/js/bootstrap.min.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/supabase-config.js"></script>
</body>

</html>
